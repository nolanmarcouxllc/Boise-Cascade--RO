# =============================================================================
# Client config: Boise Cascade
# -----------------------------------------------------------------------------
# Everything client-specific lives here. Onboarding a second client is a copy
# of this file + their delivery CSV -- no code changes. The engine reads:
#   - schema:     how to map THIS client's CSV columns to our standard fields
#   - geocoding:  provider + cache settings for address -> lat/lng
#   - detection:  what counts as a "consolidation candidate"
#   - costs:      the rate card used to turn wasted trips into dollars
# =============================================================================

client:
  name: "Boise Cascade"
  slug: "boise_cascade"

# Default dataset for this client (overridable with `run.py --data ...`).
data_file: "data/boise_cascade_deliveries.csv"

# --- Column mapping ----------------------------------------------------------
# LEFT  = our standard field name (used everywhere in the engine)
# RIGHT = the column header in THIS client's raw CSV
# A different client just remaps these; the engine code never changes.
schema:
  order_id: "order_id"
  date: "delivery_date"
  customer_id: "customer_id"
  customer_name: "customer_name"
  address: "address"
  city: "city"
  state: "state"
  zip: "zip"
  truck_id: "truck_id"
  weight_lbs: "weight_lbs"
  # Optional pre-geocoded coordinates. If present + valid, geocoding is skipped
  # for that row. Leave the columns out (or blank) to force live geocoding.
  lat: "lat"
  lng: "lng"

# --- Geocoding ---------------------------------------------------------------
geocoding:
  provider: "nominatim"                     # geopy Nominatim (OpenStreetMap)
  user_agent: "route-consolidation-diagnostic"
  # Appended to bare addresses that don't already name a region, to disambiguate.
  default_region: "Idaho, USA"
  rate_limit_seconds: 1.1                    # Nominatim asks for <= 1 req/sec
  cache_file: "cache/geocode_cache.json"     # relative to the engine dir

# --- Detection ---------------------------------------------------------------
# A "consolidation candidate" = deliveries on the SAME day that could have ridden
# one truck but didn't. Two ways to catch them:
detection:
  same_customer: true            # same customer_id, same day, >1 truck
  geo_cluster: true              # different customers but ~same location, same day
  cluster_radius_miles: 0.5      # stops within this radius = one geo cluster
  min_trucks: 2                  # need >= this many DISTINCT trucks to flag a group

# --- Cost model --------------------------------------------------------------
# The rate card. This is where the dollar figure comes from. All defensible,
# all client-tunable. See quantify.py for exactly how each rate is applied.
costs:
  currency: "USD"
  cost_per_mile: 2.10            # fully-loaded internal $/mile (fuel, maint, wear)
  cost_per_fleet_hour: 68.00     # driver wage + vehicle time, $/hour
  third_party_rate_per_mile: 3.25 # 3PL benchmark $/mile (opportunity comparison)
  avg_speed_mph: 32.0            # to convert extra miles -> fleet-hours
  service_time_minutes: 20       # avg time lost per redundant stop (park/unload/paperwork)

  # Depot / distribution center the trucks run out of. Wasted mileage is modeled
  # as the extra depot->stop->depot out-and-backs that consolidation would remove.
  depot:
    name: "Boise Cascade DC"
    address: "1111 W Jefferson St, Boise, ID 83702"
    lat: 43.6169
    lng: -116.2064
